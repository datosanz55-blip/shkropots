# Вариант деплоя через Dokploy -> Compose.
# Для типа "Application" (Dockerfile) этот файл не нужен: Dokploy соберёт
# образ сам, а порт контейнера (80) указывается в настройках домена.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: shkropots-web
    restart: unless-stopped

    # Порт НЕ публикуем наружу.
    # Раньше тут стоял "ports: 8080:80" — это открывало сайт на :8080
    # по голому HTTP в обход Traefik и Let's Encrypt. Traefik ходит
    # в контейнер по внутренней сети, публикация порта ему не нужна.
    expose:
      - "80"

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

# Если Dokploy не подхватывает сервис автоматически, его нужно привести
# в сеть Traefik. Раскомментировать (имя сети смотреть в Dokploy):
#
#     networks:
#       - dokploy-network
#
# networks:
#   dokploy-network:
#     external: true
