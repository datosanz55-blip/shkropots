# Security-заголовки.
#
# ПОЧЕМУ ОТДЕЛЬНЫМ ФАЙЛОМ, А НЕ ОДИН РАЗ В server{}:
# в nginx директивы add_header НЕ суммируются с родительским уровнем —
# как только в location появляется свой add_header, все унаследованные
# пропадают. Раньше заголовки стояли один раз в server{}, и до браузера
# они доходили только на /healthz: у остальных location был свой
# add_header Cache-Control, который их затирал. Поэтому подключаем
# этот файл в КАЖДЫЙ location.
add_header X-Content-Type-Options   "nosniff"                        always;
add_header X-Frame-Options          "SAMEORIGIN"                     always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
