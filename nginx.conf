server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Сжатие текстовых ресурсов.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # HTML не кешируем — чтобы правки сразу подхватывались (сайт ещё дорабатывается).
    # Регулярка вместо точного адреса: страниц теперь две.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Данные каталога меняются чаще всего — кешировать нельзя,
    # иначе после обновления посетители неделями видят старый каталог.
    location = /catalog-data.js {
        add_header Cache-Control "no-cache";
    }

    # CSS и JS без версионирования в имени: час, потом перепроверка.
    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Картинки и шрифты — содержимое не меняется, кешируем надолго.
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Базовые security-заголовки.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Отдаём health-check без логирования.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
