server {
    # IPv6-слушателя сознательно нет: в контейнере Docker IPv6 по умолчанию
    # выключен, и "listen [::]:80" роняет nginx на старте с
    # "socket() [::]:80 failed (97: Address family not supported by protocol)".
    # Наружу всё равно смотрит Traefik, он ходит в контейнер по IPv4.
    listen       80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;
    charset       utf-8;
    charset_types text/css text/plain text/javascript application/javascript
                  application/json image/svg+xml;

    # Сжатие. text/javascript и application/javascript оба в списке:
    # nginx менял mime-тип для .js между версиями, и при несовпадении
    # сжатие молча перестаёт работать.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml
                      text/javascript application/javascript application/json
                      application/xml application/rss+xml image/svg+xml;

    # Health-check для Dokploy. Без add_header — сюда заголовки не нужны.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # HTML не кешируем: правки должны подхватываться сразу.
    location ~* \.html$ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Наполнение каталога меняется чаще всего — кеш запрещён,
    # иначе после обновления посетители неделями видят старый каталог.
    location = /catalog-data.js {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /robots.txt  { include /etc/nginx/snippets/security.conf; add_header Cache-Control "public, max-age=3600" always; }
    location = /sitemap.xml { include /etc/nginx/snippets/security.conf; add_header Cache-Control "public, max-age=3600" always; }

    # CSS и JS без версии в имени: час, потом перепроверка.
    location ~* \.(?:css|js)$ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # Картинки и шрифты: имя файла = содержимое, кешируем надолго.
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    # Всё остальное — это HTML-страницы и 404.
    #
    # $uri.html даёт человеческие адреса: /catalog открывает catalog.html.
    # Раньше тут стоял "try_files $uri $uri/ /index.html" — фолбэк для SPA,
    # и он врал: /catalog и любой битый адрес отдавали ЛЕНДИНГ с кодом 200.
    # Поисковик индексировал это как бесконечные копии главной.
    location / {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }
}
